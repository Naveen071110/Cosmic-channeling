name: CI / Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Full TypeScript Typecheck (Client, Shared & Worker)
        run: npm run check

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Run Production Build (Vite)
        run: npm run build
