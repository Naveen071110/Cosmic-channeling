<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="cosmicBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="70%" stop-color="#0E081C"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </radialGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Cosmic Disk -->
  <rect width="64" height="64" rx="16" fill="url(#cosmicBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

  <!-- Radial Aura Glow -->
  <circle cx="32" cy="32" r="26" fill="url(#aura)"/>

  <!-- Celestial Orbit Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(192, 132, 252, 0.45)" stroke-width="1.2" stroke-dasharray="3 4"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>

  <!-- Orbital Stardust Nodes -->
  <circle cx="32" cy="12" r="1.8" fill="#F8FAFC"/>
  <circle cx="52" cy="32" r="1.8" fill="#F8FAFC"/>
  <circle cx="32" cy="52" r="1.5" fill="#C084FC"/>
  <circle cx="12" cy="32" r="1.5" fill="#38BDF8"/>

  <!-- 8-Pointed Celestial Star Centerpiece -->
  <!-- Primary Cardinal Rays -->
  <polygon points="32,6 34.8,27.5 49,20 36.5,32 49,44 34.8,36.5 32,58 29.2,36.5 15,44 27.5,32 15,20 29.2,27.5" fill="url(#starGlow)"/>

  <!-- Inner Diamond Core -->
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF"/>
</svg>
